<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <title>axtest — Readable browser tests</title>
    <meta name="description" content="Write readable browser tests, organize your projects, and review results in one workspace." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>try{if(localStorage.getItem('axtest_dark')==='true')document.documentElement.classList.add('dark')}catch{}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
